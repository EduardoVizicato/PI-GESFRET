<div class="modal fade" id="addTravelModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="addTravelModal" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addTravelModal">Registrar Nova Viagem</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="close.emit()"></button>
      </div>
      <div class="modal-body">
        <form id="formFrete" [formGroup]="travelForm" (ngSubmit)="onSubmit()">
          @if (currentStep === 1) {
          <div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="startDate" class="form-label">Data de Saida</label>
                <input type="date" class="form-control" id="startDate" formControlName="startDate" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="endDate" class="form-label">Data de Chegada</label>
                <input type="date" class="form-control" id="endDate" formControlName="endDate" required>
              </div>
            </div>
            <hr>
            <app-routes-options [parentForm]="travelForm"></app-routes-options>
            <hr>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="veiculo" class="form-label">Veículo Utilizado</label>
                <select class="form-select" id="veiculo" required formControlName="vehiclePlate"
                  (change)="onTruckChange()">
                  <option selected disabled value="">- Selecione um veículo -</option>
                  @for (truck of filteredTrucks; track truck.id) {
                  <option value="{{truck.vehicleRegistrationPlate.registrationPlate}}">
                    {{truck.vehicleRegistrationPlate.registrationPlate | plateFormat}} | {{truck.name}}</option>
                  }
                </select>
              </div>
              <div *ngIf="selectedTruck?.wheelType === 'Cavalo (2-3 eixos e acopla carroceria)'" class="col-md-6 mb-3">
                <label for="" class="form-label">Reboque Utilizado</label>
                <select class="form-select" id="">
                  <option selected disabled value="">- Selecione um Reboque -</option>
                  @for (truck of filteredTrailers; track truck.id) {
                  <option value="{{truck.vehicleRegistrationPlate.registrationPlate}}">
                    {{truck.vehicleRegistrationPlate.registrationPlate | plateFormat}} | {{truck.name}}
                  </option>
                  }
                </select>
              </div>
            </div>
          </div>
          }
          @if (currentStep === 2) {
          <div>
            <div formGroupName="load">
              <div class="mb-3">
                <label for="produto" class="form-label">Produto Predominante</label>
                <input type="text" class="form-control" id="produto" placeholder="" formControlName="product" required>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="pesoCarga" class="form-label">Tipo de Produto</label>
                  <select id="tipo-carga " formControlName="loadType" required>
                    <option disabled value="">- Selecione o tipo de carga -</option>
                    <option value="1">Carga de Granel Sólido</option>
                    <option value="2">Carga de Granel Líquido</option>
                    <option value="3">Carga Frigorificada ou Aquecida</option>
                    <option value="4">Carga Conteinerizada</option>
                    <option value="5">Carga Geral</option>
                    <option value="6">Carga Neogranel</option>
                    <option value="7">Carga Perigosa (granel sólido)</option>
                    <option value="8">Carga Perigosa (granel líquido)</option>
                    <option value="9">Carga Perigosa (carga frigorificada ou aquecida)</option>
                    <option value="10">Carga Perigosa (conteinerizada)</option>
                    <option value="11">Carga Perigosa (carga geral)</option>
                    <option value="12">Carga Granel Pressurizada</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="pesoCarga" class="form-label">Peso da Carga (kg)</label>
                  <input (focus)="setCursorEnd($event)" currencyMask [options]="weightOptions" type="text"
                    class="form-control text-start" id="pesoCarga" placeholder="" formControlName="weight">
                </div>
              </div>
            </div>

            <hr>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="inputGroupFile02" class="form-label">Anexar CTE</label>
                <input type="file" class="form-control" id="inputGroupFile02">
              </div>
              <div class="col-md-6 mb-3">
                <label for="valorFrete" class="form-label">Valor do Frete (R$)</label>
                <div class="d-flex gap-2">
                  <input (focus)="setCursorEnd($event)" currencyMask [options]="valueOptions" type="text"
                    class="form-control flex-grow-1 text-start" id="valorFrete" step="0.01" placeholder=""
                    formControlName="price">
                  <a class="btn" id="btn-calc">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                      class="bi bi-calculator" viewBox="0 0 16 16">
                      <path
                        d="M12 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
                      <path
                        d="M4 2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z" />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </div>
          }
        </form>
      </div>
      <div class="modal-footer">
        @if (currentStep === 1) {
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="close.emit()">Cancelar</button>
        <button type="button" class="btn btn-dark" (click)="nextStep()">Próximo</button>
        }
        @if (currentStep === 2) {
        <button type="button" class="btn btn-secondary" (click)="previousStep()">Voltar</button>
        <button type="submit" form="formFrete" class="btn btn-dark">Salvar Viagem</button>
        }
      </div>
    </div>
  </div>
</div>
