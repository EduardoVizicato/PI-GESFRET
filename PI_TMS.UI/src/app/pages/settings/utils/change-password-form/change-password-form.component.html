<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="changePasswordModalLabel">Alterar Senha</h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form #changePasswordNgForm="ngForm" id="changePasswordForm" (ngSubmit)="changePassword()" autocomplete="off" novalidate>
          <div class="form-group mb-3">
            <label for="currentPassword">Senha Atual</label>
            <input
              type="password"
              id="currentPassword"
              name="currentPassword"
              class="form-control"
              ngModel
              #currentPassword="ngModel"
              required
              autocomplete="current-password" 
            />
            <div *ngIf="currentPassword.invalid && (currentPassword.dirty || currentPassword.touched)" class="invalid-feedback d-block">
              Senha atual é obrigatória.
            </div>
          </div>

          <div class="form-group mb-3">
            <label for="newPassword">Nova Senha</label>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              class="form-control"
              ngModel
              #newPasswordModel="ngModel"
              required
              minlength="6"
              autocomplete="new-password"
            />
             <div *ngIf="newPasswordModel.invalid && (newPasswordModel.dirty || newPasswordModel.touched)" class="invalid-feedback d-block">
              <div *ngIf="newPasswordModel.errors?.['required']">Nova senha é obrigatória.</div>
              <div *ngIf="newPasswordModel.errors?.['minlength']">A senha deve ter no mínimo 6 caracteres.</div>
            </div>
          </div>

          <div class="form-group mb-3">
            <label for="confirmPassword">Confirmar Nova Senha</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-control"
              ngModel
              #confirmPasswordModel="ngModel"
              required
              autocomplete="new-password"
            />
            <div *ngIf="confirmPasswordModel.invalid && (confirmPasswordModel.dirty || confirmPasswordModel.touched)" class="invalid-feedback d-block">
              Confirmação de senha é obrigatória.
            </div>
            <div *ngIf="changePasswordNgForm.value.newPassword !== changePasswordNgForm.value.confirmPassword && confirmPasswordModel.touched" class="invalid-feedback d-block">
              As senhas não coincidem.
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Fechar</button>
        <button type="submit" form="changePasswordForm" class="btn btn-primary">Alterar Senha</button>
      </div>
    </div>
  </div>
</div>
