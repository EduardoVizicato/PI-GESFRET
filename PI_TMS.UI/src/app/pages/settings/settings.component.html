<app-sidebar></app-sidebar>
<div class="main-content">
  <div class="clearfix">
    <app-enterprise-form></app-enterprise-form>
    
    <app-user-form></app-user-form>

    <hr>

    <div class="d-grid gap-2 d-md-flex justify-content-md-start px-5">
        <button type="button" class="btn btn-primary" (click)="openChangePasswordModal()">
            Alterar Senha
        </button>
    </div>

  </div>
</div>

@if (showChangePasswordModal()) {
  @defer (when showChangePasswordModal()) {
    <app-change-password-form 
      (loaded)="onChangePasswordModalLoaded()" 
      (closeModal)="closeChangePasswordModal()">
    </app-change-password-form>
  } @loading (minimum 300ms) {
    <div class="modal-backdrop fade show"></div>
    <div class="modal d-block" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center p-4">
            <div class="d-flex justify-content-center">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
            <p class="mt-3 mb-0">Carregando...</p>
          </div>
        </div>
      </div>
    </div>
  }
}
