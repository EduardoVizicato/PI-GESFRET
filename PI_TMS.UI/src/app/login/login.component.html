<div class="main-container">
  <div class="form-container">
    <form class="login-form needs-validation" [formGroup]="LoginForm" (ngSubmit)="SendLogin()" novalidate>
      <h2 class="form-title">Bem-vindo de volta!</h2>
      <p class="form-subtitle">Faça login para continuar</p>
      <div class="form-group">
        <label for="user">Email</label>
        <div class="inputs">
          <i class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </i>
          <input type="text" name="usuario" id="user" placeholder="seu@email.com" class="input-field" formControlName="email"
                 [class.is-invalid]="LoginForm.get('email')?.invalid && (LoginForm.get('email')?.dirty || LoginForm.get('email')?.touched)">
        </div>
        <div *ngIf="LoginForm.get('email')?.invalid && (LoginForm.get('email')?.dirty || LoginForm.get('email')?.touched)"
             class="invalid-feedback d-block"> <div *ngIf="LoginForm.get('email')?.errors?.['required']">
            Email obrigatório.
          </div>
          <div *ngIf="LoginForm.get('email')?.errors?.['email']">
            O email deve ser um endereço de email válido.
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <div class="inputs">
          <i class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </i>
          <input type="password" name="senha" id="password" placeholder="Sua senha" class="input-field"
                 formControlName="password"
                 [class.is-invalid]="LoginForm.get('password')?.invalid && (LoginForm.get('password')?.dirty || LoginForm.get('password')?.touched)">
        </div>
        <div *ngIf="LoginForm.get('password')?.invalid && (LoginForm.get('password')?.dirty || LoginForm.get('password')?.touched)"
             class="invalid-feedback d-block">
          <div *ngIf="LoginForm.get('password')?.errors?.['required']">
            Senha obrigatória.
          </div>
          <div *ngIf="LoginForm.get('password')?.errors?.['pattern']">
            A senha deve ter pelo menos 6 caracteres, uma letra maiúscula e um número.
          </div>
        </div>
        
      </div>
      <input class="submit-button" type="submit" value="Entrar" [disabled]="LoginForm.invalid">
      <div class="form-footer">
        <p class="form-footer-text">
          Não tem uma conta? <a routerLink="/signUp-enterprise">Cadastre-se</a>
        </p>
      </div>
    </form>
    <button class="theme-toggle" (click)="themeService.toggleTheme()">
      @if (themeService.isDarkMode()) {
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-brightness-high-fill" viewBox="0 0 16 16">
  <path d="M12 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
</svg>
} @else {
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-fill" viewBox="0 0 16 16">
        <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
      </svg>
}
    </button>
  </div>

  <div class="image-side">
  </div>
</div>
