<div class="container my-5">
    <div class="text-center">
        <div class="navlogo">
                <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-truck">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    <path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    <path d="M5 17h-2v-11a1 1 0 0 1 1 -1h9v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5" />
                </svg>
                <span class="logo">Ges<span class="logo-2">fret</span></span>
            </div>
            
        <h1>Verifique seu email</h1>
        <p class="text-muted">Enviamos um código de 6 dígitos para o seu email: <strong>{{ email }}</strong></p>

        <div class="d-flex justify-content-center gap-2 mt-4">
            @for (digit of code; track i; let i = $index) {
                <input
                    #codeInput
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    class="form-control text-center verification-code-input"
                    maxlength="1"
                    [(ngModel)]="code[i]"
                    (input)="onInput($event, i)"
                    (keyup)="onKeyUp($event, i)"
                    (paste)="onPaste($event, i)"
                    [attr.aria-label]="'Dígito ' + (i + 1) + ' do código de verificação'">
            }
        </div>

        <div class="mt-4">
            <button class="btn btn-primary" 
                    [disabled]="isCodeIncomplete()" 
                    (click)="verifyCode()">
                Confirmar
            </button>
        </div>
    </div>
</div>
